[project]
name = "brise-rca-score"
version = "0.3.2"
description = "SLS-free RCA fault, entity, process, and overall scorer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml"]

[project.optional-dependencies]
dev = ["build>=1", "mypy>=1.10", "pytest>=7", "ruff>=0.8,<0.9", "types-PyYAML"]

[project.scripts]
rca-score = "brise_rca_score.local_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"brise_rca_score.data" = ["*.yaml", "*.json"]
"brise_rca_score.data.prompts" = ["*.md", "*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
